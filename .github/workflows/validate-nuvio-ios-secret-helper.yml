name: Validate iPad Actions secret setup helper
on:
  push:
    paths:
      - scripts/configure-nuvio-ios-ipa-actions.sh
      - .github/workflows/validate-nuvio-ios-secret-helper.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and confidential upload boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/configure-nuvio-ios-ipa-actions.sh
          grep -Fq 'gh secret set "$SECRET" --repo "$REPO" --app actions' scripts/configure-nuvio-ios-ipa-actions.sh
          grep -Fq 'gh workflow run ios-test-build.yml' scripts/configure-nuvio-ios-ipa-actions.sh
          grep -Fq 'trap ' scripts/configure-nuvio-ios-ipa-actions.sh
          grep -Fq 'dest.chmod(0o600)' scripts/configure-nuvio-ios-ipa-actions.sh
          echo 'BASH_SYNTAX=PASS'
          echo 'ENCRYPTED_GH_SECRET_UPLOAD=PASS'
          echo 'NO_APP_INSTALL=PASS'
      - name: Run configuration normalization test with synthetic local values
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mkdir -p "$temp/Developer/NuvioTV_OfficialBeta_Port" "$temp/.nuvio"
          cat > "$temp/.nuvio/secrets.properties" <<'PROPS'
          SUPABASE_URL=https://example.invalid
          SUPABASE_ANON_KEY=fake-anon
          SIMKL_CLIENT_ID=synthetic_client_id
          TMDB_API_KEY=fake-tmdb
          PROPS
          mkdir -p "$temp/bin"
          cat > "$temp/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          if [[ "$1" == auth ]]; then exit 0; fi
          if [[ "$1" == secret ]]; then
            cat > "$HOME/staged-value.b64"
            exit 0
          fi
          if [[ "$1" == workflow ]]; then
            printf 'mock workflow trigger\n' > "$HOME/workflow-requested"
            exit 0
          fi
          exit 9
          MOCK
          chmod +x "$temp/bin/gh"
          HOME="$temp" PATH="$temp/bin:$PATH" bash scripts/configure-nuvio-ios-ipa-actions.sh
          test -f "$temp/workflow-requested"
          base64 -d < "$temp/staged-value.b64" > "$temp/decoded.txt"
          grep -q '^NUVIO_SUPABASE_URL=https://example.invalid$' "$temp/decoded.txt"
          grep -q '^NUVIO_SUPABASE_ANON_KEY=fake-anon$' "$temp/decoded.txt"
          grep -q '^SIMKL_CLIENT_ID=synthetic_client_id$' "$temp/decoded.txt"
          echo "ANDROID_TO_IPAD_PROPERTY_MAPPING=PASS"
          echo "NO_REAL_CREDENTIALS_USED=PASS"
