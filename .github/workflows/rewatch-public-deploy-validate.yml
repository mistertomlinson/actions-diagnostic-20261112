name: Validate guarded replay exposure helper
on:
  push:
    paths:
      - scripts/enable-rewatch-public.py
      - .github/workflows/rewatch-public-deploy-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python deployment helper
        run: python3 -m py_compile scripts/enable-rewatch-public.py
      - name: Check Caddy guard swap is deliberately narrow
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, re
          from pathlib import Path
          tree=ast.parse(Path("scripts/enable-rewatch-public.py").read_text())
          nodes=[node for node in tree.body
                 if isinstance(node,(ast.ClassDef,ast.FunctionDef))
                 and node.name in ("Stop","replace_guard")]
          mod=ast.Module(body=nodes,type_ignores=[])
          ns={"re":re}
          exec(compile(mod,"guard_test","exec"),ns)
          swap=ns["replace_guard"]
          example="example.com {\n respond 204\n}\nnuviorewatch.duckdns.org {\n respond 503\n}\n"
          out=swap(example)
          assert "example.com {\n respond 204\n}" in out
          assert "reverse_proxy 127.0.0.1:8765" in out
          assert "respond 503" not in out
          for body in ("reverse_proxy 127.0.0.1:9999",
                       "respond 503\n handle {\n respond 404\n }"):
              try: swap("nuviorewatch.duckdns.org {\n"+body+"\n}")
              except ns["Stop"]: pass
              else: raise AssertionError("unsafe non-503 guard accepted")
          print("PYTHON_SYNTAX=PASS")
          print("CADDY_REWRITE_SCOPE=PASS")
          print("COMPLEX_GUARD_FAILS_CLOSED=PASS")
          PY
      - name: Verify disabled systemd unit exit status handling
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          from unittest.mock import Mock
          src=Path("scripts/enable-rewatch-public.py").read_text()
          tree=ast.parse(src)
          nodes=[x for x in tree.body if isinstance(x,ast.FunctionDef)
                 and x.name=="service_autostart_disabled"]
          assert len(nodes)==1
          ns={"sp": Mock(), "SERVICE":"nuvio-rewatch-staging.service"}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),
                       "unit_test", "exec"),ns)
          ns["sp"].run.return_value=Mock(stdout="disabled\n",returncode=1)
          assert ns["service_autostart_disabled"]()
          ns["sp"].run.return_value=Mock(stdout="enabled\n",returncode=0)
          assert not ns["service_autostart_disabled"]()
          ns["sp"].run.return_value=Mock(stdout="",returncode=1)
          assert not ns["service_autostart_disabled"]()
          print("SYSTEMD_DISABLED_EXIT_1=PASS")
          print("SYSTEMD_ENABLED_REJECTED=PASS")
          PY

      - name: Validate curl readiness retry and actionable failure status
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("scripts/enable-rewatch-public.py").read_text())
          nodes = [node for node in tree.body
                   if isinstance(node, (ast.ClassDef, ast.FunctionDef))
                   and node.name in ("Stop", "check_http")]
          assert len(nodes) == 2
          import types
          ns = {"time": types.SimpleNamespace(sleep=lambda _: None)}
          exec(compile(ast.Module(body=nodes, type_ignores=[]),
                       "retry_test", "exec"), ns)
          calls = []
          def transient(url, **kwargs):
              calls.append(url)
              if len(calls) < 3:
                  raise ns["Stop"]("CURL_EXIT_7")
              return "400"
          ns["status"] = transient
          ns["check_http"]("BOOTSTRAP_LOCAL_READY", "http://localhost/test",
                           "400", attempts=5)
          assert len(calls) == 3
          ns["status"] = lambda *_a, **_kw: "503"
          try:
              ns["check_http"]("CADDY_READ", "https://example.test",
                               "401", attempts=2)
          except ns["Stop"] as error:
              assert "HTTP_CADDY_READ_FAILED_EXPECTED_401_GOT_503" in str(error)
          else:
              raise AssertionError("Wrong HTTP result incorrectly accepted")
          print("NODE_STARTUP_CURL_RETRY=PASS")
          print("FAILED_HTTP_STAGE_DIAGNOSTIC=PASS")
          PY
